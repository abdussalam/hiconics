set_tou_slot:
  name: Set TOU Slot Settings
  description: Sets time-of-use (TOU) schedule slot parameters on the Hiconics inverter.
  fields:
    slot:
      name: Slot Number
      description: TOU Slot (1 to 6)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 6
    start_time:
      name: Start Time
      description: Start time format HHMM or HH:MM
      required: true
      example: "0130"
      selector:
        text:
    end_time:
      name: End Time
      description: End time format HHMM or HH:MM
      required: true
      example: "0500"
      selector:
        text:
    mode:
      name: Mode
      description: "0: Idle / Self-Use, 1: Charge, 2: Discharge"
      required: true
      default: 0
      selector:
        select:
          options:
            - label: "0 - Idle / Self Use"
              value: "0"
            - label: "1 - Charge"
              value: "1"
            - label: "2 - Discharge"
              value: "2"
    max_amps:
      name: Max Charge Amps
      description: Maximum permitted charging amps (0.0 to 25.0 A).
      default: 25.0
      selector:
        number:
          min: 0.0
          max: 25.0
          step: 0.1
    max_soc:
      name: Max SOC / Target SOC
      description: Target or Maximum SOC percentage (50 to 100%).
      default: 100
      selector:
        number:
          min: 50
          max: 100
    min_soc:
      name: Min SOC
      description: Minimum reserve SOC percentage (0 to 100%).
      default: 18
      selector:
        number:
          min: 0
          max: 100

set_inverter_mode:
  name: Set Inverter General Mode
  description: Sets the system working mode of the inverter.
  fields:
    mode:
      name: Inverter Mode
      description: "1: Self Use, 6: TOU"
      required: true
      example: "1"
      selector:
        select:
          options:
            - label: "1 - Self Use"
              value: "1"
            - label: "6 - TOU"
              value: "6"

read_settings:
  name: Read Inverter Settings
  description: Sends a request to trigger reading specified setting group registers from the inverter.
  fields:
    type:
      name: Setting Group
      description: Choose which settings register block to query.
      required: true
      selector:
        select:
          options:
            - label: Inverter Mode
              value: mode
            - label: Battery Settings
              value: battery
            - label: TOU Settings
              value: tou

send_command:
  name: Send Raw API Command
  description: Sends an arbitrary control code and raw payload to the Solarman API (Advanced).
  fields:
    code:
      name: Command Code
      description: E.g., s_A1, s_A8, r_A1
      required: true
      example: "s_A8"
      selector:
        text:
    operation_type:
      name: Operation Type
      description: Usually 4 for read, 5 for write.
      required: true
      default: 5
      selector:
        number:
          min: 1
          max: 10
    input_param:
      name: Input Parameter Object
      description: JSON key-value dictionary to inject into extendWeb.inputParam
      required: true
      example: '{"C40": {"v": "0130"}}'
      selector:
        object:
    timeout:
      name: Order Timeout
      description: Time to wait for API state completion in seconds.
      required: false
      default: 180
      selector:
        number:
          min: 10
          max: 300
