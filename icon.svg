<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Solar Gold Gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Battery Green Gradient -->
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Home Assistant Blue Gradient -->
    <linearGradient id="haBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Container (Rounded App Icon Style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Home Assistant Roof Outline (Background Element) -->
  <path d="M 256 90 L 400 200 V 220 H 370 V 197 L 256 110 L 142 197 V 220 H 112 V 200 Z" fill="url(#haBlueGrad)" opacity="0.35" />

  <!-- Solar Rays / Sunburst Top -->
  <g fill="url(#solarGrad)" opacity="0.9">
    <circle cx="256" cy="115" r="18" />
    <rect x="251" y="70" width="10" height="20" rx="5" />
    <rect x="200" y="85" width="10" height="20" rx="5" transform="rotate(-45 205 95)" />
    <rect x="302" y="85" width="10" height="20" rx="5" transform="rotate(45 307 95)" />
  </g>

  <!-- Battery Body Frame -->
  <rect x="146" y="190" width="220" height="250" rx="28" fill="none" stroke="url(#haBlueGrad)" stroke-width="16" />
  
  <!-- Battery Terminal Top -->
  <rect x="216" y="168" width="80" height="22" rx="6" fill="url(#haBlueGrad)" />

  <!-- Battery Charge Levels (Green Energy Blocks) -->
  <rect x="172" y="380" width="168" height="38" rx="10" fill="url(#batteryGrad)" />
  <rect x="172" y="332" width="168" height="38" rx="10" fill="url(#batteryGrad)" />
  <rect x="172" y="284" width="168" height="38" rx="10" fill="url(#batteryGrad)" opacity="0.75" />

  <!-- Central Inverter Lightning Bolt (Glowing Overlay) -->
  <path d="M 275 195 L 205 310 H 260 L 237 415 L 315 290 H 260 Z" fill="url(#solarGrad)" filter="url(#glow)" stroke="#FFFFFF" stroke-width="3" />
</svg>
